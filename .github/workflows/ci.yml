name: Build and Test

# Manually triggered from the Actions tab. Nothing starts this automatically, so pushing to
# master does not run it. Building and testing happen locally; this is for when a run on a
# clean machine is wanted.
on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
