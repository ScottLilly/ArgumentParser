# Builds and tests the solution on a clean machine, which is the thing a local build cannot
# prove: that nothing depends on something only this working copy has.
#
# Runs on every push to master and on pull requests against it, so the Build Status badge in the
# README means what a reader assumes it means. Also available from the Actions tab for a run on a
# clean machine without pushing anything.

name: Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# Stated explicitly so this workflow stays read-only regardless of the repo's default token
# permissions. It only needs to check out, build, test, and identify the repo to Coveralls,
# none of which writes anything back here.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Runs every test project in the solution. Adding another one needs nothing here, as long
      # as it is in the solution.
      #
      # "XPlat Code Coverage" is coverlet, which both test projects already reference. The
      # exclusions in CodeCoverage.runsettings are what keep the test assemblies out of the
      # numbers, so the figure that reaches Coveralls is the shipping library alone.
      - name: Test
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Coverlet writes each project's report into its own GUID-named folder, so the paths
      # cannot be written out here, and the action takes a space-separated list rather than a
      # glob. Both reports are uploaded and merged: they cover the same library today, but the
      # two projects compile it for different target frameworks, so a future #if would show up
      # in only one of them.
      - name: Find the coverage reports
        id: coverage
        run: echo "files=$(find ./coverage -name coverage.cobertura.xml | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # github-token defaults to the built-in one, which is all this needs: Coveralls creates
      # the project on the first upload, so there is no account setup and no repo secret.
      #
      # fail-on-error is off because a pull request from a fork gets a restricted token that
      # cannot post, so the default would fail an outside contributor's build for something
      # their change had nothing to do with. The trade is that a genuinely broken upload goes
      # quiet and the badge goes stale, so the step's log is the place to look if the badge
      # stops moving.
      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          format: cobertura
          files: ${{ steps.coverage.outputs.files }}
          fail-on-error: false
